<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Leren met spellen</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e6f3ff">
<link rel="icon" href="shared/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="shared/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leren">
<link rel="stylesheet" href="shared/kes.css?v=202611251700">
</head>
<body>
<main class="wrap">
  <div class="hero">
    <div class="badge">🚀</div>
    <div>
      <h1 id="hoi">Hoi!</h1>
      <p>Huiswerk en toetsen, maar dan als spel. <button class="crumb linkish" id="wissel" hidden>👤 wissel speler</button></p>
    </div>
  </div>
  <div class="lessons">
    <!-- Nieuwe les? Voeg hier een kaartje toe (nieuwste bovenaan). -->
    <a class="lesson" href="topografie-drenthe/" data-id="topografie-drenthe" data-total="20">
      <span class="emoji">🗺️</span>
      <h2>Topografie Drenthe</h2>
      <p>16 plaatsen, 3 kanalen en de Hondsrug. Waar ligt het en hoe schrijf je het?</p>
      <span class="when">Aardrijkskunde · november 2026</span>
      <span class="voortgang"></span>
    </a>
  </div>
  <p class="foot">Kaarten: © CBS/PDOK, © OpenStreetMap-bijdragers.</p>
</main>
<script src="shared/speler.js?v=202611251700"></script>
<script>
// Naam van de speler en voortgang per les (zelfde sleutels als shared/topo.js)
(function () {
  var naam = SPELER.huidig();
  if (naam) { document.getElementById("hoi").textContent = "Hoi " + naam + "!"; document.getElementById("wissel").hidden = false; }
  document.getElementById("wissel").onclick = function () {
    var main = document.querySelector("main");
    SPELER.kies(function () { location.reload(); }, main);
  };
  document.querySelectorAll(".lesson[data-id]").forEach(function (a) {
    try {
      if (!naam) return;
      var p = JSON.parse(localStorage.getItem(SPELER.sleutel(a.dataset.id)));
      if (!p) return;
      var items = Object.values(p.items || {});
      var known = items.filter(function (s) { return s.loc >= 3 && s.spell >= 3; }).length;
      var last = (p.tests || [])[p.tests.length - 1];
      a.querySelector(".voortgang").textContent =
        "⭐ Je kent er al " + known + " van de " + (a.dataset.total || items.length) + (last ? " · laatste oefentoets: " + last.grade : "");
    } catch (e) {}
  });
})();
</script>
</body>
</html>
